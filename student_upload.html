<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<title>שליחת דפים למורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --blue: #0b57d0;
    --blue-soft: #e8f0fe;
    --red: #d93025;
    --yellow: #f9ab00;
    --green: #188038;
    --green-soft: #e6f4ea;
    --ink: #202124;
    --muted: #5f6368;
    --line: #e3e7ee;
    --bg: #f5f7fb;
    --radius: 22px;
    --shadow: 0 14px 40px rgba(32, 33, 36, 0.1);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 15% 0%, #e8f0fe 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, #fce8e6 0%, transparent 40%),
                var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  #app {
    max-width: 620px;
    margin: 0 auto;
    padding: 18px 16px 48px;
    padding-top: max(18px, env(safe-area-inset-top));
  }

  .app-header { text-align: center; padding: 14px 0 20px; }
  .app-logo {
    width: 62px;
    height: 62px;
    margin: 0 auto 12px;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
  .app-header h1 {
    margin: 0 0 6px;
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: -0.01em;
  }
  .app-header p { margin: 0; color: var(--muted); font-size: 1rem; font-weight: 500; }

  .card {
    background: #ffffff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 22px 18px;
  }

  label.field-label {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .name-input {
    width: 100%;
    height: 58px;
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 0 16px;
    font-family: inherit;
    font-size: 1.12rem;
    font-weight: 500;
    color: var(--ink);
    background: #fbfcfe;
    margin-bottom: 8px;
  }
  .name-input:focus {
    outline: none;
    border-color: var(--blue);
    background: #ffffff;
    box-shadow: 0 0 0 4px var(--blue-soft);
  }
  .name-input::placeholder { color: #9aa0a6; }

  .folder-hint {
    margin: 0 0 18px;
    font-size: 0.86rem;
    color: var(--muted);
    min-height: 18px;
  }
  .folder-hint strong { color: var(--blue); font-weight: 700; }

  .pages-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .pages-head span:first-child { font-size: 1rem; font-weight: 700; }
  .page-count {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-soft);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .page-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .empty-pages {
    grid-column: 1 / -1;
    border: 2px dashed #d4dae5;
    border-radius: 16px;
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 500;
    background: #fbfcfe;
  }

  .page-item {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    overflow: hidden;
    background: #eef1f6;
    border: 1px solid var(--line);
  }
  .page-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .page-index {
    position: absolute;
    top: 6px;
    right: 6px;
    min-width: 22px;
    height: 22px;
    border-radius: 999px;
    background: rgba(32, 33, 36, 0.7);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
  }
  .page-remove {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);
    color: var(--red);
    font-size: 0.9rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  .pick-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .pick {
    appearance: none;
    border: none;
    min-height: 76px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1.04rem;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    transition: transform 0.14s ease, opacity 0.2s ease;
  }
  .pick.camera { background: var(--blue); box-shadow: 0 10px 22px rgba(11, 87, 208, 0.28); }
  .pick.gallery { background: #ffffff; color: var(--blue); border: 2px solid var(--blue-soft); box-shadow: 0 6px 16px rgba(11, 87, 208, 0.08); }
  .pick:not(:disabled):active { transform: scale(0.97); }
  .pick:disabled { opacity: 0.45; cursor: default; }

  .file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    border: 0;
    padding: 0;
    margin: -1px;
  }

  .submit {
    appearance: none;
    width: 100%;
    border: none;
    min-height: 66px;
    border-radius: 18px;
    background: var(--green);
    color: #ffffff;
    font-family: inherit;
    font-size: 1.22rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(24, 128, 56, 0.28);
    transition: transform 0.14s ease, opacity 0.2s ease;
    margin-top: 6px;
  }
  .submit:not(:disabled):active { transform: scale(0.98); }
  .submit:disabled { opacity: 0.42; cursor: default; box-shadow: none; }

  .privacy { margin: 12px 0 0; text-align: center; font-size: 0.8rem; color: var(--muted); }

  .fatal-message {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.55;
    max-width: 420px;
    color: var(--ink);
  }
  .fatal-emoji { font-size: 3.4rem; margin-bottom: 10px; }

  .success-screen {
    background: radial-gradient(circle at 50% 10%, #e6f4ea 0%, transparent 55%), var(--bg);
  }
  .success-check {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 3.4rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 18px 40px rgba(24, 128, 56, 0.32);
    animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.5, 1) both;
    margin-bottom: 18px;
  }
  @keyframes pop {
    from { transform: scale(0.2); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-screen h2 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 900; }
  .success-screen p { margin: 0 0 22px; color: var(--muted); font-size: 1rem; line-height: 1.5; max-width: 380px; }
  .success-screen .submit { max-width: 340px; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(32, 33, 36, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .overlay-card {
    width: 100%;
    max-width: 340px;
    background: #fff;
    border-radius: 22px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
  }
  .overlay-rocket { font-size: 3rem; animation: floaty 0.9s ease-in-out infinite alternate; }
  @keyframes floaty {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-14px) rotate(5deg); }
  }
  .overlay-text { margin: 12px 0 18px; font-size: 1.05rem; font-weight: 700; }
  .overlay-bar { height: 8px; border-radius: 999px; background: #eef1f6; overflow: hidden; direction: ltr; }
  .overlay-bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #0b57d0, #1a73e8, #f9ab00);
    animation: slidebar 1.1s ease-in-out infinite alternate;
  }
  @keyframes slidebar {
    from { transform: translateX(-60%); }
    to { transform: translateX(160%); }
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #202124;
    color: #fff;
    font-size: 0.94rem;
    font-weight: 600;
    line-height: 1.45;
    padding: 13px 18px;
    border-radius: 14px;
    max-width: calc(100vw - 36px);
    text-align: center;
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 80;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 380px) {
    .pick-row { grid-template-columns: 1fr; }
    .pick { min-height: 66px; }
    .app-header h1 { font-size: 1.35rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<section id="fatalScreen" class="screen" hidden>
  <div class="fatal-emoji">😕</div>
  <p id="fatalMessage" class="fatal-message"></p>
</section>

<main id="app" hidden>
  <header class="app-header">
    <div class="app-logo">📸</div>
    <h1>שולחים דף למורה</h1>
    <p>מצלמים, בודקים, שולחים – וזהו.</p>
  </header>

  <div class="card">
    <label class="field-label" for="studentName">איך קוראים לך?</label>
    <input id="studentName" class="name-input" type="text" dir="auto" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="השם המלא שלך">
    <p id="folderHint" class="folder-hint"></p>

    <div class="pages-head">
      <span>הדפים שצילמת</span>
      <span id="pageCount" class="page-count">0 דפים</span>
    </div>
    <div id="pageGrid" class="page-grid"></div>

    <div class="pick-row">
      <button id="cameraBtn" type="button" class="pick camera">צלם דף 📷</button>
      <button id="galleryBtn" type="button" class="pick gallery">העלה תמונות 🖼️</button>
    </div>
    <input id="cameraInput" class="file-input" type="file" accept="image/*" capture="environment" aria-label="צילום דף">
    <input id="galleryInput" class="file-input" type="file" accept="image/*" multiple aria-label="בחירת תמונות">

    <button id="submitBtn" type="button" class="submit" disabled>שלח למורה 🚀</button>
    <p class="privacy">רק המורה רואה את הדפים 💛</p>
  </div>
</main>

<section id="successScreen" class="screen success-screen" hidden>
  <div class="success-check">✓</div>
  <h2>הדפים נשלחו למורה 🎉</h2>
  <p id="successDetails"></p>
  <button id="againBtn" type="button" class="submit">סריקת תלמיד נוסף</button>
</section>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-rocket">🚀</div>
    <p id="overlayText" class="overlay-text">שולח למורה...</p>
    <div class="overlay-bar"><span></span></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const APPS_SCRIPT_URL = 'YOUR_WEB_APP_URL';
  const MAX_PAGES = 12;
  const MAX_IMAGE_EDGE = 1800;
  const JPEG_QUALITY = 0.82;
  const BUSY_RETRIES = 3;
  const BUSY_DELAY_MS = 2000;
  const TOAST_MS = 4200;

  const FORCE_DEMO = new URLSearchParams(window.location.search).get('demo') === '1';
  const IS_LOCAL_HOST = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const API_URL = (String(APPS_SCRIPT_URL).indexOf('YOUR_') === 0 && (IS_LOCAL_HOST || FORCE_DEMO)) ? '/exec' : 'https://script.google.com/macros/s/AKfycbwRDidb42eK8DW4zMd6V4NZMl3W2Pe5tdod02RzxdIn4JgD28DqpwZMxafXM_sk9GY6/exec';

  const params = new URLSearchParams(window.location.search);
  const FOLDER = (params.get('folder') || '').trim();
  const CODE = (params.get('k') || '').trim();

  const ERROR_MSGS = {
    INVALID_ACCESS: 'הקישור לא תקין – בקשו מהמורה קישור חדש',
    MISSING_NAME: 'כתבו את השם שלכם',
    FILE_TOO_LARGE: 'הקובץ גדול מדי – נסו לצלם פחות דפים',
    INVALID_FILE_TYPE: 'הקובץ לא נתמך – נסו לצלם שוב',
    SERVER_BUSY: 'השרת עסוק כרגע – נסו שוב בעוד רגע',
    SERVER_ERROR: 'ההעלאה נכשלה – בקשו מהמורה לבדוק את הגדרות הדרייב',
    NETWORK: 'משהו השתבש בשליחה – בדקו את האינטרנט ונסו שוב',
    PDF_LIB: 'לא הצלחנו להכין את הקובץ – רעננו את הדף ונסו שוב',
    IMAGE_ERROR: 'לא הצלחנו לקרוא את התמונה – נסו לצלם שוב',
    MAX_PAGES: 'אפשר לשלוח עד ' + MAX_PAGES + ' דפים בכל פעם'
  };

  const state = {
    pages: [],
    busy: false
  };

  function AppError(code) {
    this.code = code;
    this.name = 'AppError';
    this.message = code;
  }
  AppError.prototype = Object.create(Error.prototype);
  AppError.prototype.constructor = AppError;

  const el = {
    fatal: document.getElementById('fatalScreen'),
    fatalMessage: document.getElementById('fatalMessage'),
    app: document.getElementById('app'),
    studentName: document.getElementById('studentName'),
    folderHint: document.getElementById('folderHint'),
    pageGrid: document.getElementById('pageGrid'),
    pageCount: document.getElementById('pageCount'),
    cameraBtn: document.getElementById('cameraBtn'),
    galleryBtn: document.getElementById('galleryBtn'),
    cameraInput: document.getElementById('cameraInput'),
    galleryInput: document.getElementById('galleryInput'),
    submitBtn: document.getElementById('submitBtn'),
    success: document.getElementById('successScreen'),
    successDetails: document.getElementById('successDetails'),
    againBtn: document.getElementById('againBtn'),
    overlay: document.getElementById('overlay'),
    overlayText: document.getElementById('overlayText'),
    toast: document.getElementById('toast')
  };

  function showToast(message) {
    el.toast.textContent = message;
    el.toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () {
      el.toast.classList.remove('show');
    }, TOAST_MS);
  }

  function showFatal(message) {
    el.app.hidden = true;
    el.success.hidden = true;
    el.fatalMessage.textContent = message;
    el.fatal.hidden = false;
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function updateControls() {
    var full = state.pages.length >= MAX_PAGES;
    el.cameraBtn.disabled = state.busy || full;
    el.galleryBtn.disabled = state.busy || full;
    el.submitBtn.disabled = state.busy || state.pages.length === 0;
    el.pageCount.textContent = state.pages.length === 1
      ? 'דף אחד'
      : (state.pages.length + ' דפים');
  }

  function renderPages() {
    el.pageGrid.innerHTML = '';
    if (state.pages.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-pages';
      empty.textContent = 'עוד לא צילמת דפים. צלמו את הדף הראשון 📷';
      el.pageGrid.appendChild(empty);
      updateControls();
      return;
    }

    state.pages.forEach(function (page, index) {
      var item = document.createElement('div');
      item.className = 'page-item';

      var img = document.createElement('img');
      img.src = page.dataUrl;
      img.alt = 'דף ' + (index + 1);
      item.appendChild(img);

      var badge = document.createElement('span');
      badge.className = 'page-index';
      badge.textContent = String(index + 1);
      item.appendChild(badge);

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'page-remove';
      remove.setAttribute('aria-label', 'הסרת דף ' + (index + 1));
      remove.textContent = '✕';
      remove.addEventListener('click', function () {
        if (state.busy) { return; }
        state.pages.splice(index, 1);
        renderPages();
      });
      item.appendChild(remove);

      el.pageGrid.appendChild(item);
    });

    updateControls();
  }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var objectUrl = URL.createObjectURL(file);
      var image = new Image();
      image.onload = function () {
        try {
          var width = image.naturalWidth || image.width;
          var height = image.naturalHeight || image.height;
          if (!width || !height) {
            throw new Error('invalid image');
          }
          var scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(width, height));
          var targetWidth = Math.max(1, Math.round(width * scale));
          var targetHeight = Math.max(1, Math.round(height * scale));

          var canvas = document.createElement('canvas');
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, targetWidth, targetHeight);
          ctx.drawImage(image, 0, 0, targetWidth, targetHeight);

          var dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
          URL.revokeObjectURL(objectUrl);
          resolve({
            dataUrl: dataUrl,
            width: targetWidth,
            height: targetHeight
          });
        } catch (err) {
          URL.revokeObjectURL(objectUrl);
          reject(err);
        }
      };
      image.onerror = function () {
        URL.revokeObjectURL(objectUrl);
        reject(new Error('image decode failed'));
      };
      image.src = objectUrl;
    });
  }

  async function addFiles(fileList) {
    if (state.busy) { return; }
    var incoming = Array.prototype.slice.call(fileList || []);
    if (incoming.length === 0) { return; }

    var room = MAX_PAGES - state.pages.length;
    if (room <= 0) {
      showToast(ERROR_MSGS.MAX_PAGES);
      return;
    }
    var chosen = incoming.slice(0, room);
    if (incoming.length > room) {
      showToast(ERROR_MSGS.MAX_PAGES);
    }

    state.busy = true;
    updateControls();

    var failed = 0;
    for (var i = 0; i < chosen.length; i++) {
      var file = chosen[i];
      if (String(file.type || '').indexOf('image/') !== 0) {
        failed++;
        continue;
      }
      try {
        var page = await compressImage(file);
        state.pages.push(page);
      } catch (err) {
        failed++;
      }
    }

    state.busy = false;
    renderPages();

    if (failed > 0) {
      showToast(ERROR_MSGS.IMAGE_ERROR);
    }
  }

  function buildPdfBase64() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      throw new AppError('PDF_LIB');
    }
    var jsPDF = window.jspdf.jsPDF;
    var margin = 10;
    var doc = null;

    state.pages.forEach(function (page) {
      var orientation = page.width > page.height ? 'landscape' : 'portrait';
      if (!doc) {
        doc = new jsPDF({ orientation: orientation, unit: 'mm', format: 'a4' });
      } else {
        doc.addPage('a4', orientation);
      }

      var pageWidth = doc.internal.pageSize.getWidth();
      var pageHeight = doc.internal.pageSize.getHeight();
      var scale = Math.min(
        (pageWidth - margin * 2) / page.width,
        (pageHeight - margin * 2) / page.height
      );
      var imageWidth = page.width * scale;
      var imageHeight = page.height * scale;
      var x = (pageWidth - imageWidth) / 2;
      var y = (pageHeight - imageHeight) / 2;

      doc.addImage(page.dataUrl, 'JPEG', x, y, imageWidth, imageHeight, undefined, 'FAST');
    });

    if (!doc) {
      throw new AppError('INVALID_FILE_TYPE');
    }

    var uri = doc.output('datauristring');
    return uri.slice(uri.indexOf(',') + 1);
  }

  async function sendUpload(payload) {
    var response;
    try {
      response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
    } catch (err) {
      throw new AppError('NETWORK');
    }

    var text = await response.text();
    var data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      console.error('[upload] Non-JSON response (HTTP ' + response.status + '):', text.slice(0, 300));
      throw new AppError('NETWORK');
    }

    if (!data || data.ok !== true) {
      if (data && data.message) {
        console.error('[upload] ' + (data.errorCode || 'ERROR') + ': ' + data.message);
      }
      throw new AppError(data && data.errorCode ? data.errorCode : 'NETWORK');
    }
    return data.data || {};
  }

  async function uploadWithRetry(payload) {
    var retries = 0;
    while (true) {
      try {
        return await sendUpload(payload);
      } catch (err) {
        var busy = err instanceof AppError && err.code === 'SERVER_BUSY';
        if (busy && retries < BUSY_RETRIES) {
          retries++;
          await sleep(BUSY_DELAY_MS);
          continue;
        }
        throw err;
      }
    }
  }

  function showOverlay(text) {
    el.overlayText.textContent = text;
    el.overlay.hidden = false;
  }

  function hideOverlay() {
    el.overlay.hidden = true;
  }

  function resetForNextStudent() {
    state.pages = [];
    state.busy = false;
    el.studentName.value = '';
    renderPages();
    hideOverlay();
    el.success.hidden = true;
    el.app.hidden = false;
    el.studentName.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submit() {
    if (state.busy) { return; }

    var name = el.studentName.value.trim();
    if (!name) {
      showToast(ERROR_MSGS.MISSING_NAME);
      el.studentName.focus();
      return;
    }
    if (state.pages.length === 0) {
      showToast('צלמו לפחות דף אחד');
      return;
    }

    state.busy = true;
    updateControls();
    showOverlay('מכינים את הקובץ...');

    try {
      await sleep(60);
      var pdfBase64;
      try {
        pdfBase64 = buildPdfBase64();
      } catch (pdfErr) {
        throw pdfErr instanceof AppError ? pdfErr : new AppError('PDF_LIB');
      }
      showOverlay('שולח למורה...');

      var result = await uploadWithRetry({
        action: 'upload',
        name: name,
        folder: FOLDER,
        k: CODE,
        mimeType: 'application/pdf',
        fileBase64: pdfBase64
      });

      state.busy = false;
      hideOverlay();
      el.app.hidden = true;
      el.success.hidden = false;
      var details = 'הקובץ נשמר בתיקייה "' + (result.folderName || FOLDER || 'המורה') + '"';
      if (result.fileName) {
        details += ' בשם ' + result.fileName;
      }
      el.successDetails.textContent = details + '.';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      state.busy = false;
      hideOverlay();
      updateControls();
      var code = err instanceof AppError ? err.code : 'NETWORK';
      showToast(ERROR_MSGS[code] || ERROR_MSGS.NETWORK);
    }
  }

  function wireEvents() {
    el.cameraBtn.addEventListener('click', function () { el.cameraInput.click(); });
    el.galleryBtn.addEventListener('click', function () { el.galleryInput.click(); });

    el.cameraInput.addEventListener('change', function (event) {
      var files = Array.prototype.slice.call(event.target.files || []);
      event.target.value = '';
      addFiles(files);
    });

    el.galleryInput.addEventListener('change', function (event) {
      var files = Array.prototype.slice.call(event.target.files || []);
      event.target.value = '';
      addFiles(files);
    });

    el.submitBtn.addEventListener('click', submit);
    el.againBtn.addEventListener('click', resetForNextStudent);

    el.studentName.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        el.studentName.blur();
        if (state.pages.length > 0) {
          submit();
        }
      }
    });
  }

  function init() {
    if (!API_URL || String(API_URL).indexOf('YOUR_') === 0) {
      showFatal('ההעלאה עדיין לא מוכנה. בקשו מהמורה לנסות שוב מאוחר יותר.');
      return;
    }

    el.folderHint.innerHTML = FOLDER
      ? 'הדפים יישלחו לתיקייה <strong>' + escapeHtml(FOLDER) + '</strong>'
      : 'הדפים יישלחו ישירות למורה.';

    wireEvents();
    renderPages();
    el.app.hidden = false;
    el.fatal.hidden = true;
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  init();
})();
</script>
</body>
</html>
